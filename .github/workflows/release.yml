name: Release

on:
  push:
    tags:
      - "v*"

env:
  ODIN_VERSION: dev-2026-06

permissions:
  contents: write

jobs:
  # ── Linux amd64 ───────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          curl -fsSL \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            -o odin.tar.gz
          mkdir -p "$HOME/odin"
          tar -xzf odin.tar.gz -C "$HOME/odin"
          ODIN_DIR=$(find "$HOME/odin" -maxdepth 2 -name "odin" -type f | xargs -I{} dirname {} | head -1)
          echo "$ODIN_DIR" >> "$GITHUB_PATH"

      - name: Install Raylib system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libasound2-dev

      - name: Build libvterm (vendored, static)
        run: bash terminal/libvterm/build.sh

      - name: Fetch ripgrep (embedded in the binary)
        shell: bash
        run: bash scripts/fetch-ripgrep.sh x86_64-unknown-linux-musl

      - name: Build
        run: odin build . -out:editor -o:speed

      - name: Package
        run: |
          mkdir -p dist
          mkdir -p licenses && cp bundled/ripgrep-* licenses/
          tar -czf dist/editor-linux-amd64.tar.gz editor font/ themes/ editor.toml licenses/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Editor ${{ github.ref_name }}"
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Linux (x86_64) | `editor-linux-amd64.tar.gz` |
            | macOS (Apple Silicon) | `editor-macos-arm64.tar.gz` |
            | macOS (Intel) | `editor-macos-amd64.tar.gz` |
            | Windows (x86_64) | `editor-windows-amd64.zip` |

            Extract and run. The `font/` directory must stay next to the binary.
            Text search uses a ripgrep built into the editor (licenses in `licenses/`).
          draft: false
          prerelease: false
          files: dist/editor-linux-amd64.tar.gz

  # ── macOS arm64 (Apple Silicon) ───────────────────────────────────────────
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        env:
          # Authenticated download: the anonymous API call this replaced hit the
          # shared runners' rate limit and came back with no assets
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset naming varies across Odin releases; match on the platform
          gh release download "${ODIN_VERSION}" --repo odin-lang/Odin --pattern '*macos-arm64*' --output odin.tar.gz
          mkdir -p "$HOME/odin"
          tar -xzf odin.tar.gz -C "$HOME/odin"
          ODIN_DIR=$(find "$HOME/odin" -maxdepth 2 -name "odin" -type f | xargs -I{} dirname {} | head -1)
          echo "$ODIN_DIR" >> "$GITHUB_PATH"

      - name: Build libvterm (vendored, static)
        run: bash terminal/libvterm/build.sh

      - name: Fetch ripgrep (embedded in the binary)
        shell: bash
        run: bash scripts/fetch-ripgrep.sh aarch64-apple-darwin

      - name: Build
        run: odin build . -out:editor -o:speed

      - name: Package
        run: |
          mkdir -p dist
          mkdir -p licenses && cp bundled/ripgrep-* licenses/
          tar -czf dist/editor-macos-arm64.tar.gz editor font/ themes/ editor.toml licenses/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/editor-macos-arm64.tar.gz

  # ── macOS amd64 (Intel) ───────────────────────────────────────────────────
  build-macos-intel:
    runs-on: macos-15-intel # macos-13 runners were retired (jobs stayed queued)
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          curl -fsSL \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-macos-amd64-${ODIN_VERSION}.tar.gz" \
            -o odin.tar.gz
          mkdir -p "$HOME/odin"
          tar -xzf odin.tar.gz -C "$HOME/odin"
          ODIN_DIR=$(find "$HOME/odin" -maxdepth 2 -name "odin" -type f | xargs -I{} dirname {} | head -1)
          echo "$ODIN_DIR" >> "$GITHUB_PATH"

      - name: Build libvterm (vendored, static)
        run: bash terminal/libvterm/build.sh

      - name: Fetch ripgrep (embedded in the binary)
        shell: bash
        run: bash scripts/fetch-ripgrep.sh x86_64-apple-darwin

      - name: Build
        run: odin build . -out:editor -o:speed

      - name: Package
        run: |
          mkdir -p dist
          mkdir -p licenses && cp bundled/ripgrep-* licenses/
          tar -czf dist/editor-macos-amd64.tar.gz editor font/ themes/ editor.toml licenses/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/editor-macos-amd64.tar.gz

  # ── Windows amd64 ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        shell: pwsh
        run: |
          $url = "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_VERSION/odin-windows-$env:ODIN_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile odin.zip
          Expand-Archive -Path odin.zip -DestinationPath "$env:USERPROFILE\odin"
          $odinBin = Get-ChildItem -Path "$env:USERPROFILE\odin" -Recurse -Filter "odin.exe" |
                     Select-Object -First 1 -ExpandProperty DirectoryName
          "$odinBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC (for libvterm)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build libvterm (vendored, static)
        shell: cmd
        run: terminal\libvterm\build.bat

      - name: Fetch ripgrep (embedded in the binary)
        shell: bash
        run: bash scripts/fetch-ripgrep.sh x86_64-pc-windows-msvc

      - name: Build
        # See build.yml for why /FORCE:MULTIPLE is needed.
        run: odin build . -out:editor.exe -o:speed -extra-linker-flags:"/FORCE:MULTIPLE"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path licenses -Force | Out-Null
          Copy-Item bundled\ripgrep-* licenses\
          Compress-Archive -Path editor.exe, font, themes, editor.toml, licenses -DestinationPath dist\editor-windows-amd64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/editor-windows-amd64.zip
