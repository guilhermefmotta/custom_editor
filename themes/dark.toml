# Catppuccin Mocha dark theme
name = "dark"

[ui]
background        = "#1e1e2e"
foreground        = "#cdd6f4"
cursor            = "#f38ba8"
cursor_inactive   = "#585b70"
selection         = "#45475a"
line_highlight    = "#28283a"
line_number       = "#585b70"
line_number_cur   = "#f9e2af"
status_bar_bg     = "#181825"
status_bar_fg     = "#cdd6f4"
status_bar_sel_bg = "#89b4fa"
tab_bar_bg        = "#181825"
tab_active_bg     = "#1e1e2e"
tab_active_fg     = "#cdd6f4"
tab_inactive_bg   = "#181825"
tab_inactive_fg   = "#6c7086"
sidebar_bg        = "#181825"
sidebar_fg        = "#cdd6f4"
sidebar_sel_bg    = "#313244"
panel_bg          = "#181825"
border            = "#313244"
scrollbar         = "#313244"
scrollbar_thumb   = "#585b70"
diag_error        = "#f38ba8"
diag_warn         = "#f9e2af"
diag_info         = "#89b4fa"
diag_hint         = "#a6e3a1"
lsp_off           = "#585b70"
lsp_loading       = "#f9e2af"
lsp_ready         = "#a6e3a1"
lsp_error         = "#f38ba8"
accent            = "#89b4fa"
accent_fg         = "#1e1e2e"

[syntax]
keyword     = "#cba6f7"
string      = "#a6e3a1"
comment     = "#585b70"
number      = "#fab387"
type        = "#f9e2af"
function    = "#89b4fa"
variable    = "#cdd6f4"
operator    = "#89dceb"
preproc     = "#f38ba8"
builtin     = "#74c7ec"
constant    = "#fab387"
label       = "#a6e3a1"
escape      = "#f5c2e7"
punctuation = "#9399b2"
